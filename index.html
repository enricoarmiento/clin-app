<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clin si è spostato</title>
  <meta http-equiv="refresh" content="0; url=https://clin-app.github.io/clin/app/">
  <link rel="canonical" href="https://clin-app.github.io/clin/app/">
  <style>body{font:16px/1.5 -apple-system,system-ui,sans-serif;max-width:520px;margin:15vh auto;padding:0 24px;color:#101411}a{color:#101411}</style>
</head>
<body>
  <h1>Clin si è spostato</h1>
  <p>L'app è ora su <a href="https://clin-app.github.io/clin/app/">clin-app.github.io/clin/app</a>. Se l'avevi aggiunta alla schermata Home, aprila dal nuovo indirizzo e aggiungila di nuovo.</p>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
    if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k)));
    location.replace("https://clin-app.github.io/clin/app/" + location.search);
  </script>
</body>
</html>
